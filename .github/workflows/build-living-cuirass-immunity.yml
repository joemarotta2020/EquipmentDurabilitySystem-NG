name: Build Living Cuirass Immunity SE

on:
  push:
    branches:
      - jm-living-cuirass-immunity-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-se:
    name: Skyrim SE 1.5.97 Living Cuirass Immunity
    runs-on: windows-2022

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC x64
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Set up XMake 3.0.1
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.1'

      - name: Apply verified Living Cuirass patch
        shell: pwsh
        run: |
          python tools/apply_living_cuirass_immunity.py
          git diff --check
          git diff -- src/FoundEquipData.cpp

      - name: Verify exact patch scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'src/FoundEquipData.cpp') {
            throw "Unexpected build-time source changes: $($changed -join ', ')"
          }
          $text = Get-Content src/FoundEquipData.cpp -Raw
          if (($text.Split('JM_IsLivingDwemerCuirass(baseForm)').Count - 1) -ne 3) {
            throw 'Expected exactly three Living Cuirass guard calls.'
          }
          if (-not $text.Contains('DwarvenDeviousCuirass.esp')) {
            throw 'Exact plugin identity is missing from patched source.'
          }

      - name: Show toolchain versions
        shell: pwsh
        run: |
          cl
          xmake --version
          git submodule status --recursive

      - name: Force CommonLibSSE-NG source build
        shell: pwsh
        run: |
          Add-Content -Path lib/commonlibsse-ng/PREBUILT.md -Value ""
          Add-Content -Path lib/commonlibsse-ng/PREBUILT.md -Value "<!-- EDS CI: force SE-only CommonLib source build -->"
          git -C lib/commonlibsse-ng status --short

      - name: Configure Skyrim SE release
        shell: pwsh
        run: |
          xmake f -p windows -a x64 -m release --skyrim_se=y --skyrim_ae=n --skyrim_vr=n -y

      - name: Build Skyrim SE release
        shell: pwsh
        run: |
          xmake -vD EquipmentDurabilitySystem-NG

      - name: Stage build artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          $dll = Get-ChildItem -Path . -Recurse -File -Filter 'EquipmentDurabilitySystem-NG.dll' |
            Where-Object { $_.FullName -notmatch '\\artifact\\' } |
            Select-Object -First 1
          if (-not $dll) { throw 'EquipmentDurabilitySystem-NG.dll was not produced.' }
          Copy-Item $dll.FullName artifact\EquipmentDurabilitySystem-NG.dll

          $pdb = Get-ChildItem -Path . -Recurse -File -Filter 'EquipmentDurabilitySystem-NG.pdb' |
            Where-Object { $_.FullName -notmatch '\\artifact\\' } |
            Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName artifact\EquipmentDurabilitySystem-NG.pdb }

          "Build commit: $env:GITHUB_SHA" | Set-Content artifact\BUILD_INFO.txt
          "Authoritative baseline: 526dc2dc09c45557aba18229fa7d91b60562b5d8" | Add-Content artifact\BUILD_INFO.txt
          "Build-time patch: tools/apply_living_cuirass_immunity.py" | Add-Content artifact\BUILD_INFO.txt
          "Target: Skyrim Special Edition 1.5.97" | Add-Content artifact\BUILD_INFO.txt
          "XMake: 3.0.1" | Add-Content artifact\BUILD_INFO.txt
          Get-FileHash artifact\EquipmentDurabilitySystem-NG.dll -Algorithm SHA256 | Format-List | Out-String | Add-Content artifact\BUILD_INFO.txt
          Get-ChildItem artifact

      - name: Upload Skyrim SE build
        uses: actions/upload-artifact@v4
        with:
          name: EquipmentDurabilitySystem-NG-SE-LivingCuirassImmune
          path: artifact/
          if-no-files-found: error
          retention-days: 30
